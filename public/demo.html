<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Sitio de demostración — LeadPilot</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#0E5E59;--ink:#1E2826;--soft:#F3F7F6;--sand:#F8F4EC;--line:#E2E9E7}
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,-apple-system,sans-serif;color:var(--ink);line-height:1.6}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6vw;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .nav b{font-family:Fraunces,serif;font-size:20px;color:var(--accent)}
  .nav span{color:#62716E;font-size:13.5px}
  .banner{background:var(--ink);color:#fff;font-size:12.5px;padding:7px 6vw;letter-spacing:.01em}
  .hero{background:var(--sand);padding:9vh 6vw;display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
  h1{font-family:Fraunces,serif;font-size:clamp(30px,4.4vw,52px);line-height:1.12;font-weight:560;letter-spacing:-.01em}
  h1 em{color:var(--accent);font-style:normal}
  .hero p{margin:18px 0 26px;color:#4A5755;max-width:46ch}
  .cta{display:inline-block;background:var(--accent);color:#fff;padding:13px 24px;border-radius:10px;
    text-decoration:none;font-weight:600;font-size:15px;border:none;cursor:pointer;font-family:inherit}
  .hero-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;font-size:14px}
  .hero-card b{display:block;font-size:15px;margin-bottom:8px}
  .hero-card li{margin:6px 0 6px 18px;color:#4A5755}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:7vh 6vw}
  .svc{background:var(--soft);border-radius:14px;padding:22px}
  .svc b{font-family:Fraunces,serif;font-size:17px;color:var(--accent)}
  .svc p{font-size:13.5px;color:#4A5755;margin-top:6px}
  footer{padding:26px 6vw;border-top:1px solid var(--line);color:#62716E;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .hint{position:fixed;bottom:36px;right:100px;background:var(--ink);color:#fff;font-size:12.5px;
    padding:8px 14px;border-radius:10px;animation:fade .6s 1.2s both}
  .hint:after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
    border:6px solid transparent;border-left-color:var(--ink);border-right:none}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.hint{display:none}}
  @media(prefers-reduced-motion:reduce){.hint{animation:none}}
</style>
</head>
<body>
  <div class="banner">Sitio de demostración de LeadPilot · negocio ficticio, datos de ejemplo</div>
  <nav class="nav"><b id="bizName">—</b><span id="bizContact"></span></nav>

  <section class="hero">
    <div>
      <h1 id="heroTitle">—</h1>
      <p id="heroDesc"></p>
      <button class="cta" id="ctaBtn" type="button">Reservar ahora</button>
    </div>
    <div class="hero-card">
      <b id="cardTitle">Cómo funciona</b>
      <ul>
        <li id="cardL1">Atención inmediata por chat, 24/7</li>
        <li id="cardL2">Reserva confirmada en la misma conversación</li>
        <li>Sin llamadas ni esperas</li>
      </ul>
    </div>
  </section>

  <section class="row" id="services"></section>

  <footer>
    <span id="foot">Sitio de demostración de LeadPilot</span>
    <span id="hours"></span>
  </footer>

  <div class="hint" id="hint">💬 Háblame — respondo al instante</div>
  <script src="/widget.js" defer></script>
  <script>
    // Everything on this page comes from the active business config, so switching
    // preset switches the whole demo. Deliberately no invented stats or claims.
    const T = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };

    fetch("/api/demo-config").then(r => r.json()).then(cfg => {
      const v = cfg.vocabulary || {};
      const appointment = v.appointment || "cita";
      const accent = cfg.accentColor || "#0E5E59";
      document.documentElement.style.setProperty("--accent", accent);

      document.title = `${cfg.businessName} — sitio de demostración`;
      T("bizName", cfg.businessName);
      T("bizContact", [cfg.industry, cfg.contactPhone].filter(Boolean).join(" · "));
      T("heroTitle", cfg.businessName);
      T("heroDesc", cfg.description || "");
      T("ctaBtn", `Reservar tu ${appointment}`);
      T("cardTitle", `Reserva tu ${appointment} sin llamar`);
      T("cardL1", "Atención inmediata por chat, 24/7");
      T("cardL2", `Tu ${appointment} queda confirmada en la misma conversación`);
      T("hint", "💬 Háblame — respondo al instante");
      T("foot", `© ${new Date().getFullYear()} ${cfg.businessName} — sitio de demostración de LeadPilot`);

      const box = document.getElementById("services");
      box.innerHTML = "";
      (cfg.services || []).forEach(s => {
        const d = document.createElement("div");
        d.className = "svc";
        const b = document.createElement("b");
        b.textContent = s.name;
        const p = document.createElement("p");
        p.textContent = `Duración aproximada: ${s.duration} min`;
        d.append(b, p);
        box.appendChild(d);
      });

      document.getElementById("ctaBtn").addEventListener("click", () => {
        document.getElementById("leadpilot-widget")?.shadowRoot?.querySelector(".lp-bubble")?.click();
      });
    }).catch(() => {
      T("heroTitle", "Sitio de demostración");
      T("heroDesc", "No se pudo cargar la configuración del negocio.");
    });
  </script>
</body>
</html>
